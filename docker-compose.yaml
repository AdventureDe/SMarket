services:
  mysql:
    image: mysql:8.0
    container_name: Smysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    image: redis:7
    container_name: Sredis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: Snacos
    ports:
      - "8848:8848"   # 控制台 / HTTP
      - "9848:9848"   # gRPC（必须）
      - "9849:9849"   # gRPC（必须）
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=256m
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
